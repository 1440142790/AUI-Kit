name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # dist/ is committed to repo, skip install/build
  verify-artifacts:
    name: Verify Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify core dist
        run: test -f packages/core/dist/index.js && echo "core OK" || exit 1

      - name: Verify react dist
        run: test -f packages/react/dist/index.js && echo "react OK" || exit 1

      - name: Verify vue dist
        run: test -f packages/vue/dist/index.js && echo "vue OK" || exit 1

      - name: Verify docs dist
        run: test -f docs/.vitepress/dist/index.html && echo "docs OK" || exit 1
